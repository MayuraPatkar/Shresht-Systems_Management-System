<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Attendance Registry</title>
    <link rel="stylesheet" href="../css/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Inter, sans-serif; overflow: hidden; user-select: none; }
        .sidebar { width: 240px; }
        input, select { user-select: text; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 4px; }
        .peer:checked + div .absent-label { display: none; }
        .peer:not(:checked) + div .present-label { display: none; }
    </style>
</head>
<body class="bg-slate-100">
    <header class="fixed top-0 left-0 right-0 bg-white border-b border-slate-200 z-30 h-24 flex items-center px-4">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-3">
                <img src="../assets/icon.png" class="h-10 w-10 object-contain" alt="Icon">
                <div>
                    <h1 class="text-xl font-bold text-slate-800">Attendance Register</h1>
                    <p class="text-xs text-slate-500 font-medium">Record work days, check-in schedules, and overtime hours</p>
                </div>
            </div>
            <button id="refresh-btn" class="bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 w-10 h-10 rounded-lg shadow-sm flex items-center justify-center">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </header>
    <div class="flex pt-24 h-screen w-full overflow-hidden">
        <aside class="sidebar bg-white h-full flex flex-col border-r border-slate-200 flex-shrink-0">
            <nav class="flex-1 p-4 overflow-y-auto" id="sidebar-nav"></nav>
        </aside>
        <main class="flex-1 h-full overflow-y-auto p-6 lg:p-8 flex flex-col gap-6">
            <!-- Filter Section -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex-shrink-0">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider mb-1">Today's Ledger Date</h2>
                        <p class="text-xs text-slate-500" id="current-date-label">June 29, 2026</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="text-xs font-semibold text-slate-600 flex items-center gap-2">
                            Select Date
                            <input type="date" id="attendance-date" class="px-3 py-1.5 border border-slate-300 rounded-lg outline-none text-xs font-medium bg-slate-50">
                        </label>
                    </div>
                </div>
            </section>

            <!-- Employee Attendance Form Table -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex-1 flex flex-col min-h-0">
                <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
                    <div>
                        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Record Shift Status</h2>
                        <p class="text-xs text-slate-500 mt-1">Mark present/absent and check-in times</p>
                    </div>
                </div>
                <div class="overflow-auto flex-1">
                    <table class="w-full text-sm text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200 sticky top-0 z-10">
                            <tr>
                                <th class="px-6 py-3 text-xs font-semibold uppercase text-slate-600">Employee ID</th>
                                <th class="px-6 py-3 text-xs font-semibold uppercase text-slate-600">Name</th>
                                <th class="px-6 py-3 text-xs font-semibold uppercase text-slate-600 text-center">Status</th>
                                <th class="px-6 py-3 text-xs font-semibold uppercase text-slate-600">Start Time</th>
                                <th class="px-6 py-3 text-xs font-semibold uppercase text-slate-600">End Time</th>
                                <th class="px-6 py-3 text-xs font-semibold uppercase text-slate-600 text-right pr-8">Action</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-tbody" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="6" class="px-6 py-14 text-center text-slate-400">
                                    <i class="fas fa-users-cog text-4xl text-slate-300 mb-3 block"></i>
                                    Loading registered employees...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="../dist/public/ts/shared/core/globalScript.js"></script>
    <script>
        let allEmployees = [];
        let attendanceMap = {}; // emp_id -> attendance record

        document.addEventListener('DOMContentLoaded', () => {
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('attendance-date').value = todayStr;
            updateDateLabel(new Date());

            loadAttendanceData();
            document.getElementById('refresh-btn').addEventListener('click', loadAttendanceData);
            document.getElementById('attendance-date').addEventListener('change', (e) => {
                const selected = new Date(e.target.value);
                updateDateLabel(selected);
                loadAttendanceData();
            });
        });

        function updateDateLabel(dateObj) {
            document.getElementById('current-date-label').textContent = dateObj.toLocaleDateString('en-US', {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
        }

        async function loadAttendanceData() {
            const tbody = document.getElementById('attendance-tbody');
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="px-6 py-14 text-center text-slate-400">
                        <i class="fas fa-spinner fa-spin text-3xl text-blue-500 mb-3 block"></i>
                        Loading employee attendance roster...
                    </td>
                </tr>
            `;

            try {
                const date = document.getElementById('attendance-date').value;
                const [empRes, attRes] = await Promise.all([
                    fetch('/employee/getEmployees'),
                    fetch(`/employee/getAttendance?date=${encodeURIComponent(date)}`)
                ]);

                const empData = await empRes.json();
                const attData = await attRes.json();

                allEmployees = (empData && empData.employees) ? empData.employees : [];
                attendanceMap = {};

                if (attData && attData.attendance) {
                    attData.attendance.forEach(rec => {
                        attendanceMap[rec.emp_id] = rec;
                    });
                }

                renderAttendanceRows(allEmployees);
            } catch (err) {
                console.error("Failed to load attendance data:", err);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-14 text-center text-red-500">
                            <i class="fas fa-exclamation-triangle text-3xl mb-3 block"></i>
                            Failed to load attendance data. Please try again.
                        </td>
                    </tr>
                `;
            }
        }

        function formatTimeForInput(dateVal) {
            if (!dateVal) return '09:00';
            const d = new Date(dateVal);
            if (isNaN(d.getTime())) return '09:00';
            const hours = String(d.getHours()).padStart(2, '0');
            const minutes = String(d.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function renderAttendanceRows(employees) {
            const tbody = document.getElementById('attendance-tbody');
            if (employees.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-14 text-center text-slate-400">
                            No registered employees found. Register staff first.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = employees.map(emp => {
                const record = attendanceMap[emp.emp_id];
                const isMarked = !!record;
                const isPresent = record ? record.present : true;
                const startTime = record && record.start_time ? formatTimeForInput(record.start_time) : '09:00';
                const endTime = record && record.end_time ? formatTimeForInput(record.end_time) : '18:00';
                const disabledAttr = !isPresent ? 'disabled' : '';

                return `
                    <tr class="hover:bg-slate-50 transition-colors ${isMarked ? 'bg-slate-50/50' : ''}" id="row-${emp.emp_id}">
                        <td class="px-6 py-4 font-semibold text-slate-600">
                            EMP-${emp.emp_id}
                            ${isMarked ? '<span class="ml-2 inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold bg-blue-50 text-blue-700 border border-blue-200">Recorded</span>' : ''}
                        </td>
                        <td class="px-6 py-4 font-bold text-slate-800">${emp.name || (emp.first_name + ' ' + (emp.last_name || '')).trim()}</td>
                        <td class="px-6 py-4 text-center">
                            <label class="inline-flex items-center gap-1.5 cursor-pointer">
                                <input type="checkbox" ${isPresent ? 'checked' : ''} id="status-${emp.emp_id}" class="sr-only peer status-checkbox" data-id="${emp.emp_id}">
                                <div class="px-3 py-1 rounded-full border text-xs font-bold transition-all peer-checked:bg-green-50 peer-checked:text-green-700 peer-checked:border-green-200 bg-red-50 text-red-700 border-red-200">
                                    <span class="absent-label">Absent</span>
                                    <span class="present-label">Present</span>
                                </div>
                            </label>
                        </td>
                        <td class="px-6 py-4">
                            <input type="time" id="start-${emp.emp_id}" value="${startTime}" ${disabledAttr} class="px-2 py-1 border border-slate-200 rounded text-xs bg-white outline-none focus:border-blue-500 disabled:opacity-40 disabled:bg-slate-100">
                        </td>
                        <td class="px-6 py-4">
                            <input type="time" id="end-${emp.emp_id}" value="${endTime}" ${disabledAttr} class="px-2 py-1 border border-slate-200 rounded text-xs bg-white outline-none focus:border-blue-500 disabled:opacity-40 disabled:bg-slate-100">
                        </td>
                        <td class="px-6 py-4 text-right pr-8">
                            <button class="btn-save-attendance ${isMarked ? 'bg-amber-600 hover:bg-amber-700' : 'bg-blue-600 hover:bg-blue-700'} text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-all flex items-center gap-1.5 ml-auto" data-id="${emp.emp_id}">
                                <i class="fas ${isMarked ? 'fa-pen-to-square' : 'fa-check'} text-[11px]"></i>
                                <span>${isMarked ? 'Update' : 'Submit'}</span>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            // Delegating change listener for checkboxes
            tbody.onchange = (e) => {
                if (e.target.classList.contains('status-checkbox')) {
                    toggleRowTime(e.target.getAttribute('data-id'));
                }
            };

            // Delegating click listener for buttons
            tbody.onclick = (e) => {
                const btn = e.target.closest('.btn-save-attendance');
                if (btn) {
                    saveOrUpdateAttendance(btn.getAttribute('data-id'), btn);
                }
            };
        }

        function toggleRowTime(empId) {
            const checked = document.getElementById(`status-${empId}`).checked;
            const startInput = document.getElementById(`start-${empId}`);
            const endInput = document.getElementById(`end-${empId}`);
            startInput.disabled = !checked;
            endInput.disabled = !checked;
        }

        async function saveOrUpdateAttendance(empId, btnElement) {
            const present = document.getElementById(`status-${empId}`).checked;
            const start_time = document.getElementById(`start-${empId}`).value;
            const end_time = document.getElementById(`end-${empId}`).value;
            const date = document.getElementById('attendance-date').value;
            const existingRecord = attendanceMap[empId];

            const originalBtnHtml = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerHTML = `<i class="fas fa-spinner fa-spin text-xs"></i> Saving...`;

            try {
                // Use /employee/updateAttendance which supports upsert & edit
                const res = await fetch('/employee/updateAttendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        emp_id: empId,
                        attendance_id: existingRecord ? existingRecord._id : undefined,
                        present,
                        start_time,
                        end_time,
                        date
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    showNotification(existingRecord ? `Attendance updated for EMP-${empId}!` : `Attendance recorded for EMP-${empId}!`);
                    if (data && data.attendance) {
                        attendanceMap[empId] = data.attendance;
                    }
                    renderAttendanceRows(allEmployees);
                } else {
                    showNotification(data.message || 'Saving attendance failed');
                    btnElement.disabled = false;
                    btnElement.innerHTML = originalBtnHtml;
                }
            } catch (err) {
                console.error("Error saving attendance:", err);
                showNotification('Connection error');
                btnElement.disabled = false;
                btnElement.innerHTML = originalBtnHtml;
            }
        }

        function showNotification(message) {
            if (window.electronAPI && typeof window.electronAPI.showAlert1 === 'function') {
                window.electronAPI.showAlert1(message);
            } else {
                alert(message);
            }
        }
    </script>
</body>
</html>
